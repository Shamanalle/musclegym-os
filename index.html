<!doctype html>
<html lang="ru" data-theme="obsidian">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0d12" />
  <title>MUSCLEGYM OS — Биомеханика, Гипертрофия и Сила</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f5b963'/%3E%3Cstop offset='1' stop-color='%23e8a24a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0d12'/%3E%3Cpath d='M16 32h32M22 22v20M42 22v20M14 26v12M50 26v12' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./app.css" />
  <link rel="stylesheet" href="./fonts.css" media="print" onload="this.media='all'" />
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('mg:v1:settings_v2') || '{}');
        var t = s.theme || 'dark';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t === 'light' ? 'paper' : 'obsidian';
      } catch (e) { document.documentElement.dataset.theme = 'obsidian'; }
    })();
  </script>
</head>
<body style="margin:0;background:#0b0d12;color:#e7eaf2;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0b0d12;color:#e7eaf2">
      <div style="width:48px;height:48px;border-radius:14px;background:rgba(232,162,74,0.14);border:1px solid rgba(232,162,74,0.45);color:#e8a24a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:14px">MG</div>
      <div style="font-size:16px;font-weight:750;letter-spacing:-0.01em;margin-bottom:6px">MUSCLEGYM <span style="color:#9aa3b8;font-weight:600">OS</span></div>
      <div style="font-size:12.5px;color:#9aa3b8">Загрузка базы знаний и биомеханических схем…</div>
    </div>
  </div>
  <script defer src="./app.js"></script>
</body>
</html>
